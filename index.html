<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII - 3D Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: 'Courier New', Consolas, monospace;
      overflow: hidden;
      cursor: crosshair;
    }

    #c {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #001a00 0%, #000 100%);
      image-rendering: pixelated;
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      z-index: 10;
      pointer-events: none;
    }

    .panel {
      background: rgba(0, 20, 0, 0.8);
      border: 2px solid #0f0;
      padding: 15px;
      display: inline-block;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      font-size: 11px;
      line-height: 1.6;
    }

    .title {
      color: #0ff;
      font-size: 18px;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .stat {
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
    }

    .label {
      color: #888;
    }

    .branding {
      color: #0ff;
      font-size: 13px;
      margin: 10px 0;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .controls-info {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #0f0;
      font-size: 10px;
      color: #888;
      line-height: 1.8;
    }

    .controls-info span {
      color: #0f0;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <header class="panel">
      <h1 class="title">⚡ ASCII Art</h1>
      <div><span class="label">MODE:</span> <span class="stat" id="mode">MORPHING</span></div>
      <div><span class="label">PARTICLES:</span> <span class="stat" id="particles">1000</span></div>
      <div><span class="label">FPS:</span> <span class="stat" id="fps">60</span></div>
      <div class="controls-info">
        <span>MOUSE:</span> Rotate • <span>SCROLL:</span> Zoom • <span>CLICK:</span> Morph
      </div>
    </header>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ONLY 1 VARIABLE - Everything nested in a single namespace object!
    const $ = {
      canvas: document.getElementById('c'),
      chars: [' .\'`^",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$',
        ' ░▒▓█',
        ' .:-=+*#%@■',
        ' ▁▂▃▄▅▆▇█'],
      state: { t: 0, mode: 0, auto: 1, fps: 0, last: 0, mx: 0, my: 0 }
    };

    $.ctx = $.canvas.getContext('2d');

    (w => {
      // Canvas setup
      $.canvas.width = w.innerWidth;
      $.canvas.height = w.innerHeight;
      $.ctx.font = '8px Courier New';
      $.ctx.textBaseline = 'top';

      // Three.js scene
      $.scene = new THREE.Scene();
      $.scene.fog = new THREE.FogExp2(0x000000, 0.05);
      $.camera = new THREE.PerspectiveCamera(60, w.innerWidth / w.innerHeight, 0.1, 1000);
      $.camera.position.z = 5;

      $.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      $.renderer.setSize(w.innerWidth, w.innerHeight);
      $.renderer.setClearColor(0x000000, 1);

      // Create morphing geometries
      $.geometries = [
        new THREE.IcosahedronGeometry(1.5, 1),
        new THREE.TorusKnotGeometry(1, 0.3, 100, 16),
        new THREE.OctahedronGeometry(1.5, 2),
        new THREE.TorusGeometry(1.2, 0.4, 16, 100)
      ].map(g => new THREE.Mesh(g, new THREE.MeshPhongMaterial({
        color: 0x00ff00,
        emissive: 0x002200,
        shininess: 100,
        flatShading: true
      })));

      $.scene.add($.geometries[0]);

      // Particle system (1000 particles * 3 coordinates = 3000 values)
      $.temp = new THREE.BufferGeometry();
      $.temp.setAttribute('position', new THREE.BufferAttribute(
        new Float32Array(3000).fill(0).map(() => (Math.random() - 0.5) * 20), 3
      ));
      $.particles = new THREE.Points($.temp, new THREE.PointsMaterial({
        color: 0x00ff88,
        size: 0.05,
        transparent: true,
        opacity: 0.6
      }));
      $.scene.add($.particles);

      // Dynamic lighting
      $.temp = new THREE.DirectionalLight(0x00ffff, 1.5);
      $.temp.position.set(5, 5, 5);
      $.scene.add($.temp);

      $.temp = new THREE.DirectionalLight(0xff00ff, 0.8);
      $.temp.position.set(-5, -3, -2);
      $.scene.add($.temp);

      $.temp = new THREE.PointLight(0x00ff00, 2, 10);
      $.scene.add($.temp);

      $.scene.add(new THREE.AmbientLight(0x111111));

      // Interactions
      w.addEventListener('mousemove', e => {
        $.state.mx = (e.clientX / w.innerWidth) * 2 - 1;
        $.state.my = -(e.clientY / w.innerHeight) * 2 + 1;
      });

      w.addEventListener('wheel', e => {
        $.camera.position.z = Math.max(2, Math.min(10, $.camera.position.z + e.deltaY * 0.01));
        e.preventDefault();
      }, { passive: false });

      w.addEventListener('click', () => {
        $.state.pulse = 20;
        $.state.mode = ($.state.mode + 1) % 4;
        $.scene.remove(...$.scene.children.filter(c => c instanceof THREE.Mesh));
        $.scene.add($.geometries[$.state.mode]);
        document.getElementById('mode').textContent = ['MORPHING', 'WIREFRAME', 'SOLID', 'PARTICLES'][$.state.mode];
      });

      w.addEventListener('resize', () => {
        $.canvas.width = w.innerWidth;
        $.canvas.height = w.innerHeight;
        $.camera.aspect = w.innerWidth / w.innerHeight;
        $.camera.updateProjectionMatrix();
        $.renderer.setSize(w.innerWidth, w.innerHeight);
      });
    })(window);

    // Advanced ASCII rendering with edge detection
    $.toASCII = (imageData, w, h) => {
      $.ctx.fillStyle = '#000';
      $.ctx.fillRect(0, 0, $.canvas.width, $.canvas.height);

      $.cw = 5;
      $.ch = 9;
      $.cols = Math.floor(w / $.cw);
      $.rows = Math.floor(h / $.ch);
      $.charSet = $.chars[$.state.mode] || $.chars[0];
      $.offsetX = ($.canvas.width - $.cols * $.cw) / 2;
      $.offsetY = ($.canvas.height - $.rows * $.ch) / 2;

      for ($.y = 0; $.y < $.rows; $.y++) {
        for ($.x = 0; $.x < $.cols; $.x++) {
          $.px = $.x * $.cw;
          $.py = $.y * $.ch;
          $.i = ($.py * w + $.px) * 4;

          $.r = imageData[$.i];
          $.g = imageData[$.i + 1];
          $.b = imageData[$.i + 2];
          $.brightness = ($.r * 0.299 + $.g * 0.587 + $.b * 0.114);

          $.ri = (($.py + 1) * w + $.px) * 4;
          $.edge = Math.abs(imageData[$.i] - imageData[$.ri]) / 255;
          $.detail = $.brightness + $.edge * 50;

          $.idx = Math.floor(($.detail / 255) * ($.charSet.length - 1));
          $.char = $.charSet[Math.min($.idx, $.charSet.length - 1)];

          if ($.brightness > 5) {
            $.hue = (120 + Math.sin($.state.t * 0.001 + $.x * 0.1) * 60) % 360;
            $.lum = Math.min(95, ($.brightness / 255) * 100);
            $.ctx.fillStyle = `hsl(${$.hue}, 100%, ${$.lum}%)`;

            if ($.brightness > 200) {
              $.ctx.shadowColor = $.ctx.fillStyle;
              $.ctx.shadowBlur = 10;
            } else {
              $.ctx.shadowBlur = 0;
            }

            $.ctx.fillText($.char, $.px + $.offsetX, $.py + $.offsetY);
          }
        }
      }
    };

    // Main animation loop
    $.animate = () => {
      requestAnimationFrame($.animate);
      $.state.t = Date.now();

      // FPS counter
      if ($.state.t - $.state.last > 1000) {
        document.getElementById('fps').textContent = $.state.fps;
        $.state.fps = 0;
        $.state.last = $.state.t;
      }
      $.state.fps++;

      // Auto rotation or mouse control
      $.mx = $.state.mx || 0;
      $.my = $.state.my || 0;

      if ($.geometries) {
        $.geometries.forEach((mesh, i) => {
          if ($.state.auto) {
            mesh.rotation.x += 0.005;
            mesh.rotation.y += 0.008;
            mesh.rotation.z += 0.003;
          } else {
            mesh.rotation.x += $.my * 0.02;
            mesh.rotation.y += $.mx * 0.02;
          }

          // Pulse effect
          if ($.state.pulse > 0) {
            mesh.scale.setScalar(1 + Math.sin($.state.pulse) * 0.2);
            $.state.pulse--;
          }
        });
      }

      // Animate particles
      if ($.particles) {
        $.particles.rotation.y += 0.001;
        $.pos = $.particles.geometry.attributes.position.array;
        for ($.pi = 0; $.pi < $.pos.length; $.pi += 3) {
          $.pos[$.pi + 1] += Math.sin($.state.t * 0.001 + $.pi) * 0.01;
        }
        $.particles.geometry.attributes.position.needsUpdate = true;
      }

      // Animate lights
      if ($.scene) {
        $.scene.children.forEach(child => {
          if (child instanceof THREE.PointLight) {
            child.position.x = Math.sin($.state.t * 0.001) * 5;
            child.position.z = Math.cos($.state.t * 0.001) * 5;
          }
        });
      }

      // Render
      if ($.renderer && $.scene && $.camera) {
        $.renderer.render($.scene, $.camera);

        // Convert to ASCII
        $.gl = $.renderer.getContext();
        $.pixels = new Uint8Array($.gl.drawingBufferWidth * $.gl.drawingBufferHeight * 4);
        $.gl.readPixels(0, 0, $.gl.drawingBufferWidth, $.gl.drawingBufferHeight, $.gl.RGBA, $.gl.UNSIGNED_BYTE, $.pixels);

        $.toASCII($.pixels, $.gl.drawingBufferWidth, $.gl.drawingBufferHeight);
      }
    };

    $.animate();
  </script>
</body>

</html>
